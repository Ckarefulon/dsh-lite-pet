name: publish

# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Configure the package on npmjs.com: Settings → Trusted Publisher → GitHub Actions,
# repository Ckarefulon/dsh-lite-pet, workflow file publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure a recent npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest
        shell: pwsh

      - name: Ensure the upstream subtree exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d vendor/upstream/dsh-pet ]; then
            echo "subtree already present"
          else
            git subtree add --prefix=vendor/upstream https://github.com/PC2005-cloud/dsh-pet.git main --squash \
              -m "chore(vendor): add upstream dsh-pet assets"
          fi
        shell: bash

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
        shell: pwsh

      - name: Transcode the media library
        run: node tools/build-media.mjs
        env:
          FFMPEG: ffmpeg
          FFPROBE: ffprobe

      - name: Compile the native pet
        run: node tools/build-pet.mjs

      - name: Verify the package payload
        run: node tools/prepack-check.mjs

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public

      - name: Attach the built helper to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
