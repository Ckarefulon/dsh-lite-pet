name: publish

# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Configure the package on npmjs.com: Settings → Trusted Publisher → GitHub Actions,
# repository Ckarefulon/dsh-lite-pet, workflow file publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure a recent npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest
        shell: pwsh

      # The WebP clips are transcoded from the committed VP9 masters in vendor/webm, which
      # needs ffmpeg. It is not on the windows-latest image, so without this step the media
      # build fails before anything is packed. (An earlier "git subtree add vendor/upstream"
      # step stood here; nothing reads that tree — the masters are already committed — so it
      # only added a network round trip that could fail the job.)
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
        shell: pwsh

      # The npm package carries only the core clips (idle, work states, balance, click,
      # sleep). The 90+ ambient actions are packed separately and published with the
      # GitHub release, where the plugin fetches them on first use.
      - name: Build the core media catalog
        run: node tools/build-media.mjs

      - name: Compile the native pet
        run: node tools/build-pet.mjs

      - name: Build the full animation set for the release asset
        run: |
          node tools/build-media.mjs --tier full --out runtime/media-full
          node tools/pack-media.mjs

      - name: Verify the package payload
        run: node tools/prepack-check.mjs

      - name: Verify the archive extractor
        run: node tools/zip-selftest.mjs

      # Guards the download itself: the merged trust roots (a local TLS-terminating
      # accelerator otherwise kills every attempt), redirect handling, truncation
      # rejection, and the retry-after-failure contract.
      - name: Verify the ambient download path
        run: node tools/ambient-selftest.mjs

      # Guards unique menu command ids (every group's first item used to share id 100,
      # so the wrong clip played) and the shuffled ambient bag.
      - name: Verify the playback contract
        run: node tools/playback-selftest.mjs

      # The release asset goes up BEFORE the npm publish. It is what every new install
      # downloads on first run, so it must not be hostage to a flaky registry call:
      # when npm failed, this step never ran and the tag shipped with no asset at all.
      - name: Attach the helper and the full animation set to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            runtime/dsh-lite-pet-media-full.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public
