name: sync-assets

# Keeps vendor/upstream in step with PC2005-cloud/dsh-pet through git subtree.
# The first run adds the subtree; every later run pulls it. Runs daily at
# 04:00 Asia/Shanghai and on demand.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Ensure the upstream subtree exists
        run: |
          if [ -d vendor/upstream/dsh-pet ]; then
            echo "subtree already present"
          else
            git subtree add --prefix=vendor/upstream https://github.com/PC2005-cloud/dsh-pet.git main --squash \
              -m "chore(vendor): add upstream dsh-pet assets"
          fi
      - name: Pull the upstream subtree
        run: |
          git subtree pull --prefix=vendor/upstream https://github.com/PC2005-cloud/dsh-pet.git main --squash \
            -m "chore(vendor): sync upstream dsh-pet assets"
      - name: Push whatever the subtree produced
        run: git push origin HEAD:main
